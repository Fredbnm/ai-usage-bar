name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { (Get-Content VERSION).Trim() }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests
        run: dotnet test tests/UsageCore.Tests -c Release

      - name: Publish app (self-contained single file)
        run: >
          dotnet publish src/AIUsageBar -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=$env:VERSION -o publish/win-x64

      - name: Screenshots from sample data
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = Resolve-Path publish/win-x64/AIUsageBar.exe
          $fixtures = @('--fixture', (Resolve-Path ../docs/sample-usage.json), '--grok-fixture', (Resolve-Path ../docs/sample-grok-usage.json), '--codex-fixture', (Resolve-Path ../docs/sample-codex-usage.json), '--copilot-fixture', (Resolve-Path ../docs/sample-copilot-usage.json), '--gemini-fixture', (Resolve-Path ../docs/sample-gemini-usage.json))
          foreach ($variant in @(
              @('light', 'en', @()), @('dark', 'en', @('--dark')), @('light-pt', 'pt', @()),
              @('copilot-tab', 'en', @('--tab', 'copilot')), @('codex-tab', 'en', @('--tab', 'codex')), @('gemini-tab', 'en', @('--tab', 'gemini')), @('agents-first-run', 'en', @('--first-run')))) {
            $out = Join-Path (Resolve-Path screens) "popup-$($variant[0]).png"
            $arguments = @('--snapshot', $out, '--lang', $variant[1]) + $fixtures + $variant[2]
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "snapshot $($variant[0]) failed (exit $($process.ExitCode))" }
          }
          Get-ChildItem screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIUsageBar-Windows-screenshots
          path: windows/screens/*.png
          if-no-files-found: ignore

      - name: Installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" installer/AIUsageBar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item publish/win-x64/AIUsageBar.exe dist/AIUsageBar-Windows-Portable.exe
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: AIUsageBar-Windows
          path: windows/dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*.exe
