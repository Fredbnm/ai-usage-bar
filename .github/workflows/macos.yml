name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: swift test

      - name: Build app and installer
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build.sh
          # Fixed name so "releases/latest/download/AIUsageBar-macOS.dmg" always works.
          cp dist/AIUsageBar-*.dmg dist/AIUsageBar-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AIUsageBar-macOS
          path: macos/dist/AIUsageBar-macOS.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macos/dist/AIUsageBar-macOS.dmg
